<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'none'; object-src 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turbo IMAP</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1f33;
        color: #e8f4fc;
        font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
        user-select: none;
      }

      .splash {
        width: 100%;
        padding: 2.2rem 2.5rem 1.8rem;
        text-align: center;
        animation: fade-in 0.45s ease both;
      }

      .logo-wrap {
        position: relative;
        width: 132px;
        height: 132px;
        margin: 0 auto 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-wrap::before {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: rgba(0, 175, 240, 0.14);
        animation: glow 2.4s ease-in-out infinite;
      }

      .logo {
        position: relative;
        width: 112px;
        height: 112px;
        object-fit: contain;
        filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.28));
        animation: float 3.4s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        color: #fff;
      }

      .subtitle {
        margin: 0.35rem 0 1.4rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #7fb6d8;
      }

      .message {
        margin: 0 auto;
        max-width: 320px;
        font-size: 0.82rem;
        color: #b9d4e7;
        line-height: 1.45;
        min-height: 2.4em;
      }

      .bar {
        position: relative;
        overflow: hidden;
        height: 5px;
        margin: 1.2rem auto 1rem;
        width: 220px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }

      .bar::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 42%;
        border-radius: 999px;
        background: #00aff0;
        animation: slide 1.5s ease-in-out infinite;
      }

      .footer {
        margin: 0;
        font-size: 0.64rem;
        color: #5f84a0;
        letter-spacing: 0.04em;
      }

      @keyframes slide {
        0% {
          left: -45%;
        }
        100% {
          left: 105%;
        }
      }

      @keyframes glow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo-wrap">
        <img class="logo" src="logo.png" alt="Turbo IMAP">
      </div>
      <h1>Turbo IMAP</h1>
      <p class="subtitle">Migração de e-mail</p>
      <p class="message">Inicializando banco de dados e configurações...</p>
      <div class="bar" aria-hidden="true"></div>
      <p class="footer">Motor de processamento de e-mails</p>
    </div>
  </body>
</html>
